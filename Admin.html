<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panel de administración</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<style>
:root{--noche:#1a0c20;--mora:#3b1245;--mora2:#5a2266;--oro:#e0a526;--crema:#faf4e8;--tinta:#241520;--gris:#6f6269;--linea:#e6dccb}
*{box-sizing:border-box;margin:0}
body{font:400 1rem/1.5 system-ui,"Segoe UI",sans-serif;background:var(--crema);color:var(--tinta);padding-bottom:80px}
h1,h2,h3{font-family:Georgia,serif;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.top{background:var(--noche);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.top h1{font-size:1.15rem;flex:1}
.btn{border:0;border-radius:999px;padding:10px 20px;font-weight:700;background:var(--mora);color:#fff;text-decoration:none;display:inline-block}
.btn:hover{background:var(--mora2)}.btn.oro{background:var(--oro);color:var(--noche)}.btn.linea{background:transparent;border:1.5px solid rgba(255,255,255,.4)}
.btn.rojo{background:#fff;color:#a02a1c;border:1.5px solid #e3b4ad}.btn:disabled{opacity:.5}
.tabs{display:flex;gap:6px;padding:14px 20px 0;max-width:1000px;margin:0 auto}
.tab{border:0;background:transparent;padding:10px 18px;border-radius:999px;font-weight:700}
.tab[aria-pressed=true]{background:var(--mora);color:#fff}
.wrap{max-width:1000px;margin:0 auto;padding:16px 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--linea);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
label{display:block;font-size:.82rem;font-weight:700;margin-bottom:3px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #d8ccb9;border-radius:10px;background:#fff}
input[type=checkbox],input[type=file]{width:auto;padding:0;border:0}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;gap:18px;flex-wrap:wrap;font-size:.9rem}.checks label{display:flex;gap:6px;align-items:center;font-weight:600;margin:0}
.acc{display:flex;gap:8px;margin-top:4px}
.foto{display:flex;gap:12px;align-items:center}
.foto .vista{width:84px;height:84px;border-radius:12px;background:#eee center/cover;flex:none;display:grid;place-items:center;font-size:.7rem;color:var(--gris)}
.foto small{display:block;color:var(--gris)}
.nota{color:var(--gris);font-size:.9rem;margin:6px 0 14px}
.fila{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--linea)}
.login{max-width:380px;margin:12vh auto;background:#fff;border-radius:22px;padding:28px;border:1px solid var(--linea);display:flex;flex-direction:column;gap:12px}
.aviso{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--noche);color:#fff;padding:12px 22px;border-radius:999px;font-weight:700;z-index:20;max-width:90vw}
.aviso.mal{background:#a02a1c}
.subir{display:inline-block;margin:4px 0 0;border:1.5px solid var(--mora);color:var(--mora);border-radius:999px;padding:7px 16px;font-size:.85rem;cursor:pointer}
.subir:hover{background:var(--mora);color:#fff}.subir input{display:none}
.sep{margin:26px 0 10px;border-top:1px solid var(--linea);padding-top:16px}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===== Conexión (clave pública: es seguro que esté aquí; la seguridad real la dan las reglas RLS de Supabase) ===== */
const db = window.supabase.createClient('https://cnmcrxedcknlptnwaytn.supabase.co', 'sb_publishable__gXDOfkjHdK48FBQwAUlRg_hZayc3dX');
const app = document.getElementById('app');
let S = {tab: 'menu', cats: [], prods: [], cfg: {}, resenas: [], sugs: []};

/* ===== Utilidades ===== */
function h(tag, attrs = {}, ...kids){
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'value' || k === 'checked' || k.startsWith('on')) e[k] = v;
    else e.setAttribute(k, v === true ? (k.startsWith('aria-') ? 'true' : '') : v);
  }
  kids.flat().forEach(c => e.append(c)); return e;
}
function aviso(txt, mal){ const a = h('div', {class: 'aviso' + (mal ? ' mal' : ''), role: 'status'}, txt); document.body.append(a); setTimeout(() => a.remove(), 3200); }
const campo = (t, el) => h('div', {}, h('label', {}, t), el);
const check = (t, v, fn) => h('label', {}, h('input', {type: 'checkbox', checked: !!v, onchange: e => fn(e.target.checked)}), t);

async function comprimir(file){
  const bmp = await createImageBitmap(file), s = Math.min(1, 1200 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
}
async function subir(file){
  const ruta = Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.jpg';
  const {error} = await db.storage.from('fotos').upload(ruta, await comprimir(file), {contentType: 'image/jpeg'});
  if (error) throw error;
  return db.storage.from('fotos').getPublicUrl(ruta).data.publicUrl;
}
function fotoCampo(url, fn, etiqueta){
  const vista = h('div', {class: 'vista'}, url ? '' : 'Sin foto');
  const pon = u => { vista.style.backgroundImage = u ? 'url("' + u + '")' : ''; vista.textContent = u ? '' : 'Sin foto'; };
  pon(url);
  const inp = h('input', {type: 'file', accept: 'image/*', onchange: async e => {
    const f = e.target.files[0]; if (!f) return;
    try { aviso('Subiendo foto…'); const u = await subir(f); fn(u); pon(u); aviso('Foto lista. Recuerda tocar Guardar.'); }
    catch (er) { console.error(er); aviso('No se pudo subir la foto', true); }
  }});
  return h('div', {class: 'foto'}, vista, h('div', {}, h('small', {}, etiqueta || 'Foto'), h('label', {class: 'subir'}, 'Elegir foto', inp)));
}

/* ===== Acceso ===== */
function verLogin(msg){
  const em = h('input', {type: 'email', autocomplete: 'username', placeholder: 'tu correo'});
  const pw = h('input', {type: 'password', autocomplete: 'current-password', placeholder: 'contraseña'});
  const err = h('p', {class: 'nota', role: 'alert'}, msg || '');
  const ir = async () => {
    const {error} = await db.auth.signInWithPassword({email: em.value.trim(), password: pw.value});
    if (error) { err.textContent = 'Correo o contraseña incorrectos.'; return; }
    entrar();
  };
  pw.onkeydown = e => { if (e.key === 'Enter') ir(); };
  app.replaceChildren(h('div', {class: 'login'}, h('h1', {}, 'Panel de administración'), em, pw, h('button', {class: 'btn', onclick: ir}, 'Entrar'), err));
}
async function entrar(){
  const {data: ok} = await db.rpc('es_admin');
  if (!ok) { await db.auth.signOut(); return verLogin('Esta cuenta no tiene permiso para administrar.'); }
  await cargar(); pintar();
}
async function cargar(){
  const [c, p, k, r, s] = await Promise.all([
    db.from('categorias').select('*').order('orden'),
    db.from('productos').select('*').order('orden').order('id'),
    db.from('config').select('datos').eq('id', 1).maybeSingle(),
    db.from('resenas').select('*').order('created_at', {ascending: false}),
    db.from('sugerencias').select('*').order('votos', {ascending: false})
  ]);
  S.cats = c.data || []; S.prods = p.data || []; S.cfg = (k.data && k.data.datos) || {}; S.resenas = r.data || []; S.sugs = s.data || [];
}

/* ===== Pantallas ===== */
function pintar(){
  const tabs = [['menu', 'Menú'], ['negocio', 'Negocio'], ['opiniones', 'Opiniones']];
  app.replaceChildren(
    h('header', {class: 'top'}, h('h1', {}, S.cfg.nombre || 'Panel'),
      h('a', {class: 'btn linea', href: 'index.html', target: '_blank'}, 'Ver la web'),
      h('button', {class: 'btn oro', onclick: async () => { await db.auth.signOut(); verLogin(); }}, 'Salir')),
    h('nav', {class: 'tabs'}, tabs.map(([id, t]) => h('button', {class: 'tab', 'aria-pressed': S.tab === id, onclick: () => { S.tab = id; pintar(); }}, t))),
    h('main', {class: 'wrap'}, S.tab === 'menu' ? vistaMenu() : S.tab === 'negocio' ? vistaNegocio() : vistaOpiniones())
  );
}

function tarjeta(p){
  const f = {nombre: p.nombre, descripcion: p.descripcion, precio: p.precio, categoria_id: p.categoria_id, foto: p.foto, destacado: p.destacado};
  const sel = h('select', {onchange: e => f.categoria_id = e.target.value}, S.cats.map(c => h('option', {value: c.id, selected: c.id === f.categoria_id}, c.nombre)));
  return h('article', {class: 'card'},
    fotoCampo(f.foto, u => f.foto = u, 'Foto del producto'),
    campo('Nombre', h('input', {value: f.nombre, maxlength: 60, oninput: e => f.nombre = e.target.value})),
    campo('Descripción', h('textarea', {rows: 2, maxlength: 160, value: f.descripcion, oninput: e => f.descripcion = e.target.value})),
    h('div', {class: 'dos'}, campo('Precio ($)', h('input', {type: 'number', step: '0.05', min: 0, value: f.precio, oninput: e => f.precio = e.target.value})), campo('Categoría', sel)),
    h('div', {class: 'checks'},
      check('Disponible (se guarda al instante)', p.disponible, async v => {
        const {error} = await db.from('productos').update({disponible: v}).eq('id', p.id);
        error ? aviso('No se pudo cambiar', true) : aviso(v ? 'Disponible' : 'Marcado como agotado'); }),
      check('Más pedido', f.destacado, v => f.destacado = v)),
    h('div', {class: 'acc'},
      h('button', {class: 'btn', onclick: async () => {
        const precio = Number(f.precio);
        if (!f.nombre.trim() || !(precio >= 0)) return aviso('Revisa el nombre y el precio', true);
        const {error} = await db.from('productos').update({...f, nombre: f.nombre.trim(), precio}).eq('id', p.id);
        error ? (console.error(error), aviso('No se pudo guardar', true)) : aviso('Guardado ✓'); }}, 'Guardar'),
      h('button', {class: 'btn rojo', onclick: async () => {
        if (!confirm('¿Eliminar "' + p.nombre + '"? No se puede deshacer.')) return;
        const {error} = await db.from('productos').delete().eq('id', p.id);
        if (error) return aviso('No se pudo eliminar', true);
        await cargar(); pintar(); aviso('Eliminado'); }}, 'Eliminar')));
}
function vistaMenu(){
  return h('div', {},
    h('p', {class: 'nota'}, 'Cambia nombre, precio, foto o marca un producto como agotado. Los cambios aparecen en la web al recargarla.'),
    h('button', {class: 'btn oro', style: 'margin-bottom:16px', onclick: async () => {
      const {error} = await db.from('productos').insert({categoria_id: S.cats[0].id, nombre: 'Nuevo producto', precio: 0, disponible: false, orden: S.prods.length + 1});
      if (error) return aviso('No se pudo crear', true);
      await cargar(); pintar(); aviso('Producto creado: edítalo y actívalo'); }}, '+ Nuevo producto'),
    h('div', {class: 'grid'}, S.prods.map(tarjeta)));
}

function vistaNegocio(){
  const c = S.cfg; c.entrega = c.entrega || {activa: false, porcentaje: 0.25, minimo: 1}; c.dias = c.dias || []; c.galeria = c.galeria || [];
  const txt = (k, t, extra = {}) => campo(t, h('input', {value: c[k] || '', oninput: e => c[k] = e.target.value, ...extra}));
  const dias = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
  return h('div', {class: 'card'},
    h('h2', {}, 'Datos del negocio'),
    txt('nombre', 'Nombre del negocio'), txt('lugar', 'Ciudad o lugar'), txt('lema', 'Lema corto'),
    campo('Texto de portada', h('textarea', {rows: 3, value: c.eslogan || '', oninput: e => c.eslogan = e.target.value})),
    txt('whatsapp', 'WhatsApp (solo números con código de país, ej: 593987473481)', {inputmode: 'numeric'}),
    txt('direccion', 'Dirección o referencia'), txt('mapa', 'Enlace de Google Maps'),
    h('h3', {class: 'sep'}, 'Horario'),
    txt('horarioTexto', 'Horario que se muestra (texto)'),
    h('div', {class: 'dos'}, campo('Abre', h('input', {type: 'time', value: c.desde || '16:00', oninput: e => c.desde = e.target.value})), campo('Cierra', h('input', {type: 'time', value: c.hasta || '22:00', oninput: e => c.hasta = e.target.value}))),
    h('div', {class: 'checks'}, dias.map((d, i) => check(d, c.dias.includes(i), v => { c.dias = v ? [...new Set([...c.dias, i])] : c.dias.filter(x => x !== i); }))),
    h('h3', {class: 'sep'}, 'Entrega a domicilio'),
    h('div', {class: 'checks'}, check('Cobrar recargo por entrega', c.entrega.activa, v => c.entrega.activa = v)),
    h('div', {class: 'dos'},
      campo('Recargo (%)', h('input', {type: 'number', min: 0, max: 100, value: Math.round((c.entrega.porcentaje || 0) * 100), oninput: e => c.entrega.porcentaje = Number(e.target.value) / 100})),
      campo('Recargo mínimo ($)', h('input', {type: 'number', min: 0, step: '0.25', value: c.entrega.minimo, oninput: e => c.entrega.minimo = Number(e.target.value)}))),
    h('h3', {class: 'sep'}, 'Fotos'),
    fotoCampo(c.logo, u => c.logo = u, 'Logo'), fotoCampo(c.fotoHero, u => c.fotoHero = u, 'Foto de portada'), fotoCampo(c.fotoNosotros, u => c.fotoNosotros = u, 'Foto de "Nosotros"'),
    [0, 1, 2, 3, 4, 5].map(i => fotoCampo(c.galeria[i], u => c.galeria[i] = u, 'Galería ' + (i + 1))),
    h('button', {class: 'btn oro', onclick: async () => {
      c.galeria = c.galeria.filter(Boolean);
      const {error} = await db.from('config').upsert({id: 1, datos: c});
      error ? (console.error(error), aviso('No se pudo guardar', true)) : aviso('Guardado ✓'); }}, 'Guardar datos del negocio'));
}

function vistaOpiniones(){
  const borrar = (tabla, id) => async () => {
    if (!confirm('¿Borrar esto?')) return;
    const {error} = await db.from(tabla).delete().eq('id', id);
    if (error) return aviso('No se pudo borrar', true);
    await cargar(); pintar();
  };
  return h('div', {class: 'grid'},
    h('div', {class: 'card'}, h('h2', {}, 'Lo que piden los clientes'), h('p', {class: 'nota'}, 'Ordenado por votos: es lo que más quiere la gente que vendas.'),
      S.sugs.length ? S.sugs.map(s => h('div', {class: 'fila'}, h('span', {}, s.platillo + ' · ' + s.votos + (s.votos === 1 ? ' voto' : ' votos')), h('button', {class: 'btn rojo', onclick: borrar('sugerencias', s.id)}, 'Borrar'))) : h('p', {class: 'nota'}, 'Aún no hay sugerencias.')),
    h('div', {class: 'card'}, h('h2', {}, 'Reseñas'),
      S.resenas.length ? S.resenas.map(r => h('div', {class: 'fila'}, h('span', {}, '★'.repeat(r.estrellas) + ' ' + r.nombre + ': ' + r.comentario), h('button', {class: 'btn rojo', onclick: borrar('resenas', r.id)}, 'Borrar'))) : h('p', {class: 'nota'}, 'Aún no hay reseñas.')));
}

(async () => {
  const {data} = await db.auth.getSession();
  data.session ? entrar() : verLogin();
})();
</script>
</body>
</html>
